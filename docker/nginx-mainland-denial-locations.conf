# Include in each AIClient server block alongside the internal /_edge_auth.
# Forward only metadata to the application for audit. The application MUST honor
# the trusted, deny-only status before any authentication reservation or upstream.
location @mainland_edge_401 {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:13000;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Transfer-Encoding "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Edge-Denied-Status "401";
    proxy_set_header X-Edge-Key-Hash "";
    proxy_set_header X-Edge-Lease-ID "";
    proxy_set_header X-Edge-Lease-Mode "";
    proxy_intercept_errors off;
}

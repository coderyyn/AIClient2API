# Include this location from each production server{} block.
location = /_edge_auth {
    internal;
    proxy_pass http://127.0.0.1:18081/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Edge-Client-IP $remote_addr;
    proxy_set_header X-Edge-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header X-Goog-Api-Key $http_x_goog_api_key;
    proxy_set_header X-Edge-Query-Key $arg_key;
    proxy_set_header X-Edge-Query-Api-Key $arg_api_key;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_connect_timeout 250ms;
    proxy_read_timeout 500ms;
    proxy_send_timeout 500ms;
}

# auth_request only accepts 2xx/401/403. Restore its encoded rate rejection at
# the public boundary; unmarked permission failures remain ordinary 403s.
location @edge_auth_denied {
    internal;
    auth_request off;
    default_type application/json;
    if ($edge_response_status = "429") {
        return 429 '{"error":{"type":"rate_limit_error","code":"rate_limited","message":"Too many requests. Please retry later."}}';
    }
    return 403;
}

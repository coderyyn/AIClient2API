# http{} context. Do not log query credentials or literal client keys in key URLs.
map $edge_response_status $mainland_edge_denied_status {
    default 403;
    "403" 403;
    "429" 429;
    "503" 503;
}
map $uri $aiclient_safe_uri {
    default $uri;
    ~^/api/potluck/keys/[^/]+(?<audit_key_suffix>/.*)?$ "/api/potluck/keys/[redacted]$audit_key_suffix";
}
log_format aiclient_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $aiclient_safe_uri $server_protocol" $status $body_bytes_sent '
    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
    'urt=$upstream_response_time rid=$upstream_http_x_request_id';
